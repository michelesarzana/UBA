  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; background:#111; display:flex; align-items:center; justify-content:center; height:100vh; font-family:system-ui,-apple-system,sans-serif; }
    .login { background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:48px 40px; text-align:center; min-width:320px; }
    .login-logo { font-size:1.4rem; font-weight:800; color:#fff; margin-bottom:6px; letter-spacing:-0.5px; }

    .login-sub { font-size:0.82rem; color:#666; margin-bottom:32px; }
    .login input { background:#222; border:1px solid #444; color:#fff; padding:12px 20px; border-radius:6px; font-size:16px; margin-bottom:16px; display:block; width:100%; outline:none; }
    .login input:focus { border-color:#FDC400; }
    .login button { background:#FDC400; color:#111; border:none; padding:12px 32px; border-radius:6px; font-size:15px; font-weight:700; cursor:pointer; width:100%; transition:opacity 0.2s; }
    .login button:hover { opacity:0.9; }
    .login .error { color:#ff4444; font-size:13px; margin-top:12px; display:none; }
  </style>
</head>

function unlock() {
  var pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  try {
    var dec = CryptoJS.AES.decrypt(CIPHER, pwd).toString(CryptoJS.enc.Utf8);
    if (!dec || dec.length < 100) throw new Error('bad decrypt');
    document.open();
    document.write(dec);
    document.close();
  } catch(e) {
    var err = document.getElementById('err');
    err.style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
}
document.getElementById('pwd').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
