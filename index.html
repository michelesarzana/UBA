  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .login input:focus { border-color:#FDC400; }
    .login button { background:#FDC400; color:#111; border:none; padding:12px 32px; border-radius:6px; font-size:15px; font-weight:700; cursor:pointer; width:100%; transition:opacity 0.2s; }
    .login button:hover { opacity:0.9; }
    .login .error { color:#ff4444; font-size:13px; margin-top:12px; display:none; }
  </style>

function unlock() {
  var pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  try {
    var dec = CryptoJS.AES.decrypt(CIPHER, pwd).toString(CryptoJS.enc.Utf8);
    if (!dec || dec.length < 100) throw new Error('bad decrypt');
    document.open();
    document.write(dec);
    document.close();
  } catch(e) {
    var err = document.getElementById('err');
    err.style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
}
document.getElementById('pwd').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
