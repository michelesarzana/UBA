function unlock() {
  const pwd = document.getElementById('pwd').value;
  try {
    const dec = CryptoJS.AES.decrypt(CIPHER, pwd).toString(CryptoJS.enc.Utf8);
    if (!dec || dec.length < 100) throw new Error();
    document.open(); document.write(dec); document.close();
  } catch(e) {
    document.getElementById('err').style.display='block';
  }
}
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
